<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Ronin: Expedition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Inter:wght@400;600;800&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #09090b; /* zinc-950 */
        color: #e4e4e7; /* zinc-200 */
        overflow: hidden; /* Game container handles scroll */
      }
      
      .font-pixel {
        font-family: 'Jersey 10', sans-serif;
      }

      /* Paper Effect */
      .paper-sprite {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: bottom center;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      }

      .paper-sprite.hit {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      .paper-sprite.attacking {
        animation: lunge 0.4s ease-in-out;
      }

      .paper-sprite.dead {
        transform: rotate(90deg) scale(0.8);
        filter: grayscale(100%);
        opacity: 0.6;
      }

      @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-2deg); }
        20%, 80% { transform: translate3d(4px, 0, 0) rotate(2deg); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-4deg); }
        40%, 60% { transform: translate3d(6px, 0, 0) rotate(4deg); }
      }

      @keyframes lunge {
        0% { transform: translateX(0); }
        50% { transform: translateX(40px) scale(1.1); }
        100% { transform: translateX(0); }
      }
      
      /* CRT Scanline effect overlay */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.3;
      }
    </style>
